[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "washtrading"
version = "0.1.0"
description = "COSC 421 term project: detecting wash trading in cryptocurrency trading networks"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "python-igraph>=0.11",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "requests>=2.31",
    "tqdm>=4.66",
]

[tool.setuptools]
packages = ["washtrading"]
